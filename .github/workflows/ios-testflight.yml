name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

jobs:
  build_and_upload:
    runs-on: macos-latest
    env:
      NODE_VERSION: "22"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CAP_SERVER_URL: ${{ secrets.CAP_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate required secrets
        run: |
          for key in APPLE_TEAM_ID APPSTORE_CONNECT_KEY_ID APPSTORE_CONNECT_ISSUER_ID APPSTORE_CONNECT_API_KEY_BASE64 IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 CAP_SERVER_URL; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done
          if [[ "${CAP_SERVER_URL}" != https://* ]]; then
            echo "CAP_SERVER_URL must be HTTPS"
            exit 1
          fi
          if [[ "${CAP_SERVER_URL}" == "https://planner.example.com" ]]; then
            echo "CAP_SERVER_URL must be set to a real hosted URL"
            exit 1
          fi
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Install dependencies
        run: pnpm install

      - name: Build web app
        run: pnpm --filter @planner/web build

      - name: Add iOS platform if missing
        run: |
          if [ ! -d "apps/web/ios/App" ]; then
            pnpm --filter @planner/web cap:add:ios
          fi

      - name: Sync Capacitor iOS project
        run: pnpm --filter @planner/web cap:sync:ios

      - name: Ensure CanvasLogin native plugin stays registered
        run: |
          set -euo pipefail
          STORYBOARD="apps/web/ios/App/App/Base.lproj/Main.storyboard"
          CONFIG="apps/web/ios/App/App/capacitor.config.json"
          PLUGIN="apps/web/ios/App/App/CanvasLoginPlugin.swift"
          BRIDGE="apps/web/ios/App/App/BridgeViewController.swift"

          test -f "$PLUGIN"
          test -f "$BRIDGE"

          # cap sync can reset the storyboard back to CAPBridgeViewController
          python3 - <<'PY'
          from pathlib import Path
          storyboard = Path("apps/web/ios/App/App/Base.lproj/Main.storyboard")
          text = storyboard.read_text()
          text = text.replace(
              'customClass="CAPBridgeViewController" customModule="Capacitor"',
              'customClass="BridgeViewController" customModule="App"',
          )
          if 'customClass="BridgeViewController"' not in text:
              raise SystemExit("Main.storyboard missing BridgeViewController")
          storyboard.write_text(text)

          import json
          cfg_path = Path("apps/web/ios/App/App/capacitor.config.json")
          cfg = json.loads(cfg_path.read_text())
          classes = cfg.get("packageClassList") or []
          if "CanvasLoginPlugin" not in classes:
              classes.append("CanvasLoginPlugin")
          cfg["packageClassList"] = classes
          cfg_path.write_text(json.dumps(cfg, indent="\t") + "\n")
          print("storyboard + packageClassList OK")
          PY

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/33c49a5f-f9bd-4558-9f43-7aa017e48a93.mobileprovision"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" | grep -E 'Name|UUID|application-identifier' | head -20

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8"

      - name: Archive iOS app
        run: |
          cd apps/web/ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/StudyFlows.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ env.APPLE_TEAM_ID }}" \
            PRODUCT_BUNDLE_IDENTIFIER=com.studyflows.app \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE=33c49a5f-f9bd-4558-9f43-7aa017e48a93 \
            PROVISIONING_PROFILE_SPECIFIER="StudyFlows App Store" \
            archive

      - name: Create export options
        run: |
          cat <<EOF > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ env.APPLE_TEAM_ID }}</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                <key>com.studyflows.app</key>
                <string>StudyFlows App Store</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
            </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StudyFlows.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "${{ secrets.APPSTORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}" \
            --verbose

      - name: Upload xcodebuild logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ~/Library/Logs/gym
            ~/Library/Developer/Xcode/DerivedData/**/Logs
